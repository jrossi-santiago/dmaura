<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="DM Aura" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="A DM outreach sheet for X. Import a list, tap once, send." />
<meta name="theme-color" content="#D8460F" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<title>DM Aura — DM sheet for X</title>
<style>
:root{
  --ground:#EFE9DC; --surface:#FBF7EF; --surface-2:#F4EEE2; --sunk:#E4DCCB;
  --line:#DCD1BD; --line-soft:#E9E2D4;
  --ink:#141210; --ink-2:#4C463D; --muted:#6E6558;
  --send:#D8460F; --send-press:#B93A0B; --on-send:#FFF9F2;
  --good:#0F7382; --warn:#A35A1F; --bad:#B03A2E; --slate:#6B6055; --violet:#7A4A9E;
  --shadow:0 1px 2px rgba(20,18,16,.05), 0 8px 24px rgba(20,18,16,.07);
  --sheet-shadow:0 -8px 40px rgba(20,18,16,.24);
  --r:14px; --r-sm:10px;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0B0A; --surface:#151311; --surface-2:#201C19; --sunk:#070605;
    --line:#2E2823; --line-soft:#241F1B;
    --ink:#F7F2E9; --ink-2:#B8AF9F; --muted:#8A8073;
    --send:#FF6A38; --send-press:#E8551F; --on-send:#1A0B04;
    --good:#A9DEE8; --warn:#E0A15E; --bad:#E08479; --slate:#9C9184; --violet:#C39BE8;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
    --sheet-shadow:0 -8px 44px rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  --ground:#0B0D11; --surface:#14171D; --surface-2:#1A1E25; --sunk:#07090C;
  --line:#282D37; --line-soft:#20242B;
  --ink:#E8EBF0; --ink-2:#A8B1BF; --muted:#77808D;
  --send:#4F8DF7; --send-press:#3D7CEA; --on-send:#07142C;
  --good:#3FBE8C; --warn:#D89257; --bad:#DC7676; --slate:#8B98A8; --violet:#9E8BEC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --sheet-shadow:0 -8px 44px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent; overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
input[type="checkbox"]{accent-color:var(--send)}
button{cursor:pointer;background:none;border:0}
a{color:var(--send)}
:focus-visible{outline:2px solid var(--send); outline-offset:2px; border-radius:6px}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.hide{display:none !important}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---------- shell ---------- */
.app{max-width:760px;margin:0 auto;padding:0 0 96px}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--ground);
  padding:max(10px,env(safe-area-inset-top)) 14px 0; border-bottom:1px solid var(--line-soft);
}
.brandrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.mark{width:27px;height:27px;border-radius:8px;background:var(--send);display:grid;place-items:center;flex:none}
.mark svg{width:15px;height:15px;fill:none;stroke:var(--on-send);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:16.5px;font-weight:680;letter-spacing:-.015em;margin:0;white-space:nowrap}
@media (max-width:390px){ .brand{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)} }
.brandrow .spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);border:1px solid transparent;flex:none}
.iconbtn:hover{background:var(--surface-2);border-color:var(--line-soft)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.stats{display:flex;gap:8px;margin-bottom:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:7px 9px;text-align:left;font:inherit;color:inherit;min-width:0}
.stat:hover{border-color:var(--muted)}
.stat:active{transform:scale(.97)}
.stat b{display:block;font-family:var(--mono);font-size:18px;font-weight:600;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.today b{color:var(--send)}
.stat.streak b{color:var(--warn)}
.stat.rep b{color:var(--good)}
.goalbar{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:0 0 10px}
.goalbar i{display:block;height:100%;background:var(--send);border-radius:2px;transition:width .3s ease}
.goalbar.done i{background:var(--good)}

.searchwrap{position:relative;margin-bottom:9px}
.searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;pointer-events:none}
#q{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
#q::placeholder{color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:560;color:var(--ink-2);white-space:nowrap}
.chip .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:var(--ground);opacity:.65}

.toolbar{display:flex;gap:7px;padding:11px 14px 4px;overflow-x:auto;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.tool{flex:none}
@media (min-width:620px){.toolbar{flex-wrap:wrap;overflow:visible}}
.tool{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:580;color:var(--ink-2)}
.tool:hover{border-color:var(--muted)}
.tool svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool.go{background:var(--send);color:var(--on-send);border-color:var(--send)}
.tool.go svg{stroke-width:2}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

/* ---------- lead cards ---------- */
.list{padding:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.lead{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative}
.lead::before{content:"";width:3px;flex:none;background:var(--st,transparent)}
.lead.sel{outline:2px solid var(--send);outline-offset:-1px}
.pick{flex:none;width:38px;display:grid;place-items:center;border-right:1px solid var(--line-soft);background:var(--surface-2)}
.pick input{width:17px;height:17px}
.leadbody{flex:1;min-width:0;padding:10px 6px 10px 10px;text-align:left;display:flex;gap:10px;align-items:flex-start}
.av{position:relative;overflow:hidden;width:38px;height:38px;border-radius:50%;flex:none;background:var(--sunk);display:grid;place-items:center;font-size:14px;font-weight:680;color:#fff;letter-spacing:-.02em}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.who{flex:1;min-width:0}
.who{display:block}
.lname{display:block;font-size:15.5px;font-weight:640;letter-spacing:-.01em;line-height:1.25;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname .vf{color:var(--send);margin-left:5px}
.lhandle{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbio{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lsub{display:flex;min-width:0;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:660;letter-spacing:.03em;text-transform:uppercase;color:var(--st,var(--muted));flex:none}
.tag .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.lsub .fol{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums}
.lsub .sep{color:var(--line)}
.lsub .last{overflow:hidden;text-overflow:ellipsis}
.dmbtn{flex:none;width:76px;background:var(--surface-2);border-left:1px solid var(--line-soft);display:grid;place-items:center;text-decoration:none;color:inherit;gap:0;position:relative}
.dmbtn .circle{width:48px;height:48px;border-radius:50%;background:var(--send);display:grid;place-items:center;box-shadow:0 2px 8px color-mix(in srgb,var(--send) 38%,transparent);transition:transform .12s ease,background .12s ease}
.dmbtn:active .circle{transform:scale(.92);background:var(--send-press)}
.dmbtn svg{width:21px;height:21px;fill:var(--on-send)}
.dmbtn.manual .circle{background:var(--surface);border:1.5px solid var(--send);box-shadow:none}
.dmbtn.manual svg{fill:var(--send)}
.dmbtn .cap{position:absolute;bottom:6px;font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:680;color:var(--muted)}
.empty{padding:56px 24px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--ui);font-size:20px;font-weight:640;letter-spacing:-.015em;color:var(--ink);margin:0 0 8px}
.empty p{font-size:14px;margin:0 auto 16px;max-width:36ch;line-height:1.6}
.selbar{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--ink);color:var(--ground);border-radius:10px;margin:10px 14px -2px;font-size:13.5px;flex-wrap:wrap}
.selbar b{font-family:var(--mono)}
.selbar .spacer{flex:1}
.selbar button,.selbar select{padding:5px 10px;border-radius:7px;border:1px solid rgba(255,255,255,.28);color:var(--ground);background:transparent;font-size:12.5px;font-weight:600}
.selbar select option{color:var(--ink);background:var(--surface)}
.selbar button.danger{border-color:var(--bad);color:#fff;background:var(--bad)}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s ease}
.scrim.on{opacity:1;pointer-events:auto}
.sheet,.modal{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-radius:18px 18px 0 0;box-shadow:var(--sheet-shadow);
  max-width:760px;margin:0 auto;max-height:94dvh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}
.sheet.on,.modal.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.modal{transition:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0;flex:none}
.mhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-soft);flex:none}
.mhead h2{margin:0;font-size:17px;font-weight:660;flex:1;letter-spacing:-.01em;min-width:0}
.mbody{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mfoot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-soft);flex:none}
.btn{flex:1;padding:13px 10px;border-radius:12px;font-size:14.5px;font-weight:660;text-align:center;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.send{background:var(--send);color:var(--on-send);border-color:var(--send);text-decoration:none;display:grid;place-items:center}
.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* profile head shared by sheet + focus */
.phead{display:flex;gap:12px;align-items:flex-start;padding:12px 16px 0}
.phead .av{width:52px;height:52px;font-size:18px}
.avslot{flex:none;display:block}
.phead .who{flex:1;min-width:0}
.phead h2{margin:0;font-size:19px;font-weight:680;letter-spacing:-.018em;line-height:1.2}
.phead .h{font-size:13.5px;color:var(--ink-2);margin-top:1px}
.phead .h a{text-decoration:none;font-weight:580}
.phead .nums{display:flex;gap:12px;font-size:12.5px;color:var(--muted);margin-top:5px}
.phead .nums b{font-family:var(--mono);color:var(--ink-2);font-weight:620}
.pbio{padding:9px 16px 0;font-size:13.5px;color:var(--ink-2);line-height:1.5;white-space:pre-wrap}
.idwarn{margin:10px 16px 0;padding:9px 11px;border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:10px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.idwarn b{color:var(--warn)}

.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line-soft);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px 9px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--send)}
.panes{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pane{padding:14px 16px 8px}

.msgbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.msgbar select{flex:1;min-width:0;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:13.5px}
.msgbar .mini{font-size:12px;color:var(--ink-2);padding:7px 10px;border:1px solid var(--line);border-radius:8px;flex:none;font-weight:600}
textarea.msg{width:100%;min-height:170px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);resize:vertical;font-size:15.5px;line-height:1.55}
.msgmeta{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.msgmeta .spacer{flex:1}
.msgmeta .ct{font-family:var(--mono)}
.msgmeta .ct.over{color:var(--bad);font-weight:680}
.msgmeta .re{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;font-size:12px}

.fields{display:grid;gap:10px}
.f label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px}
.f textarea{min-height:80px;resize:vertical;line-height:1.5}
.f .hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.log{display:flex;flex-direction:column}
.logitem{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft);align-items:flex-start}
.logitem:last-child{border-bottom:0}
.logitem .when{font-family:var(--mono);font-size:11.5px;color:var(--muted);width:84px;flex:none;padding-top:2px}
.logitem .what{flex:1;min-width:0;font-size:14px}
.logitem .what b{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
.logitem .what p{margin:3px 0 0;color:var(--ink-2);white-space:pre-wrap;font-size:13px;line-height:1.5}
.logitem .kill{flex:none;width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center;border:1px solid transparent}
.logitem .kill:hover{color:var(--bad);border-color:var(--line)}
.logitem .kill svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

.outcomes{padding:10px 16px 11px;border-top:1px solid var(--line-soft);background:var(--surface);flex:none}
.olabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:660;margin-bottom:7px}
.ogrid{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.ogrid::-webkit-scrollbar{display:none}
.o{flex:none;padding:9px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:620;color:var(--ink-2);white-space:nowrap;line-height:1.2}
.o[aria-pressed="true"]{background:var(--oc);border-color:var(--oc);color:#fff}

/* ---------- focus mode ---------- */
.focus{position:fixed;inset:0;z-index:60;background:var(--ground);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.focus.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.focus{transition:none}}
.fbar{display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line-soft);flex:none}
.fbar .prog{flex:1;min-width:0}
.fbar .prog b{font-family:var(--mono);font-size:14px;font-weight:620;letter-spacing:-.02em}
.fbar .prog span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:660}
.fbar .rail{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:5px}
.fbar .rail i{display:block;height:100%;background:var(--send);transition:width .25s ease}
.fwrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:760px;margin:0 auto;width:100%}
.fcard{padding:14px 16px 4px}
.ffoot{flex:none;border-top:1px solid var(--line-soft);background:var(--surface);padding:10px 16px calc(12px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;width:100%;display:flex;gap:8px}
.ffoot .btn.send{flex:2.2;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.ffoot .btn.send svg{width:17px;height:17px;fill:currentColor}
.pace{text-align:center;font-size:11.5px;color:var(--muted);padding:0 16px 8px;font-family:var(--mono)}
.pace.warn{color:var(--warn);font-weight:640}

/* ---------- import ---------- */
.help{font-size:13px;color:var(--muted);line-height:1.55;margin:0 0 12px}
.help code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px;color:var(--ink-2)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:12px}
.drop.over{border-color:var(--send);color:var(--send);background:color-mix(in srgb,var(--send) 7%,transparent)}
.drop b{color:var(--ink);font-size:14px;display:block;margin-bottom:3px}
textarea.paste{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px;background:var(--surface-2);font-family:var(--mono);font-size:12.5px;resize:vertical;line-height:1.5}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.maprow .src{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow .src i{display:block;font-style:normal;font-family:var(--ui);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.maprow select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px;min-width:0}
.preview{font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.6}
.preview b{color:var(--ink);font-family:var(--mono)}
.section{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:680;margin:18px 0 8px}
.section:first-child{margin-top:0}

/* ---------- lists in modals ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface-2)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:14px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mini{font-size:12px;color:var(--ink-2);padding:5px 9px;border:1px solid var(--line);border-radius:7px;flex:none;font-weight:600;background:var(--surface)}
.row .mini.danger{color:var(--bad)}
.row.on{border-color:var(--send);background:color-mix(in srgb,var(--send) 7%,transparent)}
.tokens{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
.tokens button{font-family:var(--mono);font-size:11.5px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2);background:var(--surface-2)}

/* ---------- stats ---------- */
.heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}
@media (min-width:520px){.heroes{grid-template-columns:repeat(4,1fr)}}
.hero{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
.hero b{display:block;font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.hero span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:660;margin-top:3px}
.hero i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:5px}
.ring{display:flex;align-items:center;gap:14px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px;margin-bottom:18px}
.ring svg{width:76px;height:76px;flex:none;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--sunk);stroke-width:9}
.ring .val{fill:none;stroke:var(--send);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .5s ease}
.ring.done .val{stroke:var(--good)}
.ring .txt{flex:1;min-width:0}
.ring .txt b{display:block;font-size:21px;font-weight:680;letter-spacing:-.02em}
.ring .txt p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.chartwrap{position:relative;padding-top:6px}
.chart{display:flex;align-items:flex-end;gap:2px;height:140px;position:relative;border-bottom:1px solid var(--line)}
.chart .bar{flex:1;min-width:0;background:var(--send);border-radius:3px 3px 0 0;position:relative;transition:opacity .12s;min-height:2px}
.chart .bar.zero{background:var(--line);border-radius:2px 2px 0 0}
.chart .bar.today{background:var(--good)}
.chart .bar:hover,.chart .bar.on{opacity:.7}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line-soft);font-family:var(--mono);font-size:9.5px;color:var(--muted);pointer-events:none}
.gridline span{position:absolute;right:0;top:-13px;background:var(--surface);padding:0 3px}
.xlab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:7px}
.tip{position:absolute;z-index:5;background:var(--ink);color:var(--ground);padding:6px 9px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,-6px);transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-family:var(--mono)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.heat::-webkit-scrollbar{display:none}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--sunk);display:block}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--send) 28%,var(--sunk))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--send) 55%,var(--sunk))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--send) 78%,var(--sunk))}
.heat i[data-l="4"]{background:var(--send)}
.heat i.out{background:transparent}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.funnel{display:flex;flex-direction:column;gap:7px}
.fun{display:flex;align-items:center;gap:10px;font-size:13px}
.fun .lb{width:82px;flex:none;color:var(--ink-2);font-weight:580}
.fun .track{flex:1;height:22px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.fun .track i{display:block;height:100%;background:var(--fc,var(--send));border-radius:6px;transition:width .4s ease}
.fun .vv{width:74px;flex:none;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.fun .vv b{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:560;z-index:80;opacity:0;pointer-events:none;transition:all .2s ease;max-width:92vw;text-align:center}
.toast .undo{pointer-events:auto;cursor:pointer;color:var(--send);margin-left:10px;text-decoration:underline;text-underline-offset:3px;padding:2px 4px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.booting{position:fixed;inset:0;z-index:95;background:var(--ground);display:grid;place-items:center;color:var(--muted);font-size:14px;padding:24px;text-align:center}
</style>
</head>

<script>
(function(){
"use strict";

/* ============================== model ==============================
   One JSON blob in localStorage. Every record carries `updated` and every
   deletion leaves a tombstone in `deleted`, so a later Supabase sync can
   reconcile last-write-wins without reshaping any of this.
==================================================================== */

const KEY_PREFIX = "dmaura.v1.";
const LEGACY_KEY  = "reach.v1.default";   // pre-rename store, migrated on first load
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
      const r = Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16);
    }));

const STATUS = {
  queued:  {label:"Queued",    color:"var(--slate)"},
  sent:    {label:"DM sent",   color:"var(--send)"},
  replied: {label:"Replied",   color:"var(--good)"},
  booked:  {label:"Booked",    color:"var(--violet)"},
  no:      {label:"Not interested", color:"var(--bad)"},
  skip:    {label:"Skipped",   color:"var(--muted)"}
};
const STATUS_ORDER = ["queued","sent","replied","booked","no","skip"];
const DONE = ["replied","booked","no","skip"];   // out of the sending queue

const DEFAULT_TPL = `Hey {first} — {greeting} your post on {topic}.

I'm {me}, I {pitch}.

{ask}`;

const STARTER_TEMPLATES = [
  { name:"Warm intro",
    body:`Hey {first} — {saw|caught|came across} your stuff on {topic}. Genuinely good.

Quick context: I'm {me} and I {pitch}.

{Worth a look|Open to a quick look}? Happy to send over a 2-min rundown — no pitch call needed.` },
  { name:"Straight ask",
    body:`{Hey|Hi} {first}, I'll keep this short.

I {pitch}. Given what you're building, thought it might land.

Want me to send the details?` },
  { name:"Compliment + question",
    body:`{first} — your bio line "{bioshort}" made me reach out.

{Curious|Quick question}: {question}

I'm {me}, working on {company}.` }
];

function blank(){
  return {
    v:1,
    leads: [],
    templates: STARTER_TEMPLATES.map(t => ({id:uid(), name:t.name, body:t.body, updated:Date.now()})),
    deleted: [],
    deletedDms: [],
    settings: {
      me:"", company:"", pitch:"help founders turn their audience into pipeline",
      question:"how are you handling outbound right now?",
      dailyGoal:20, dailyCap:60, paceSeconds:0,
      theme:"auto", tplId:null, openInApp:false, autoCopy:true, updated:0
    }
  };
}

let db = blank();
const cacheKey = () => KEY_PREFIX + "default";

function load(){
  try{
    let raw = localStorage.getItem(cacheKey());
    if(!raw){
      // Anyone who used the tool under its old name keeps their leads.
      const legacy = localStorage.getItem(LEGACY_KEY);
      if(legacy){
        raw = legacy;
        localStorage.setItem(cacheKey(), legacy);
        localStorage.removeItem(LEGACY_KEY);
      }
    }
    if(!raw) return blank();
    const d = JSON.parse(raw);
    const base = blank();
    d.leads = (d.leads||[]).map(mkLead);
    d.templates = (d.templates||[]).length ? d.templates : base.templates;
    d.settings = Object.assign(base.settings, d.settings||{});
    d.deleted = d.deleted || [];
    d.deletedDms = d.deletedDms || [];
    return d;
  }catch(e){ return blank(); }
}
function save(){
  try{ localStorage.setItem(cacheKey(), JSON.stringify(db)); }
  catch(e){ toast("Couldn't save — storage is full or blocked"); }
}
function mkLead(o){
  const l = Object.assign({
    id:uid(), xid:"", handle:"", name:"", bio:"", avatar:"", website:"", location:"",
    followers:0, following:0, tweets:0, verified:false,
    status:"queued", tags:[], listName:"", note:"", draft:"", tplId:null,
    dms:[], created:Date.now(), updated:0
  }, o||{});
  l.handle = String(l.handle||"").replace(/^@/,"").trim();
  l.xid = String(l.xid||"").replace(/\D/g,"");
  l.followers = +l.followers || 0;
  l.following = +l.following || 0;
  l.tweets = +l.tweets || 0;
  l.tags = Array.isArray(l.tags) ? l.tags : String(l.tags||"").split(/[,;|]/).map(s=>s.trim()).filter(Boolean);
  l.dms = (l.dms||[]).map(d => Object.assign({id:uid()}, d));
  l.updated = +l.updated || Date.now();
  if(!STATUS[l.status]) l.status = "queued";
  return l;
}
function touch(l){ l.updated = Date.now(); return l; }

/* ============================== helpers ============================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dayKey(ts){
  const d = new Date(ts==null?Date.now():ts);
  return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
function today(){ return dayKey(); }
function fmtDay(key){
  const [y,m,d] = String(key||"").split("-").map(Number);
  if(!y) return key;
  return new Date(y, m-1, d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function when(ts){
  const d = new Date(ts), n = new Date();
  const day = d.toDateString()===n.toDateString() ? "Today"
    : d.toDateString()===new Date(n-864e5).toDateString() ? "Yest"
    : d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return day+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function compact(n){
  n = +n||0;
  if(n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n >= 1e3) return (n/1e3).toFixed(n>=1e4?0:1).replace(/\.0$/,"")+"K";
  return String(n);
}
function firstName(s){
  const clean = String(s||"").replace(/[^\p{L}\p{N}\s'’.-]/gu," ").trim();
  return clean.split(/\s+/)[0] || "";
}
function plural(n, one, many){ return n===1 ? one : (many||one+"s"); }

let toastT, toastUndo = null;
function toast(msg, undo){
  const t = $("#toast");
  toastUndo = undo || null;
  t.innerHTML = esc(msg) + (undo ? ' <b class="undo">Undo</b>' : "");
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("on"); toastUndo = null; }, undo ? 6000 : 2600);
}
$("#toast").addEventListener("click", e => {
  if(!toastUndo || !e.target.closest(".undo")) return;
  const fn = toastUndo; toastUndo = null;
  $("#toast").classList.remove("on");
  fn();
});

function copyText(s){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(s);
  }catch(e){}
  // Older Safari on iOS: a throwaway textarea is still the only reliable path.
  try{
    const ta = document.createElement("textarea");
    ta.value = s; ta.setAttribute("readonly","");
    ta.style.cssText = "position:absolute;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, s.length);
    document.execCommand("copy");
    document.body.removeChild(ta);
  }catch(e){}
  return Promise.resolve();
}

// Warm-side hues only: blues and violets fought the vermilion ground.
const AV_COLORS = ["#D8460F","#A35A1F","#0F7382","#7A4A9E","#B03A2E","#6B6055","#8A6D1F","#1C6E5A"];
function avColor(seed){
  let h = 0; const s = String(seed||"?");
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
function initials(l){
  const src = (l.name || l.handle || "?").trim();
  const parts = src.split(/\s+/).filter(Boolean);
  const a = parts[0] ? parts[0][0] : "?";
  const b = parts[1] ? parts[1][0] : "";
  return (a+b).toUpperCase();
}
function avatarHTML(l, cls){
  // Initials sit underneath; the photo covers them, and a broken URL removes
  // itself so the initials are simply what you see.
  const img = l.avatar
    ? `<img src="${esc(l.avatar)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()" />`
    : "";
  return `<span class="av ${cls||""}" style="background:${avColor(l.handle)}">${esc(initials(l))}${img}</span>`;
}

function paintAvatar(slot, l){ if(slot) slot.innerHTML = avatarHTML(l); }

/* ============================== X deep links ==============================
   The whole point of the tool. With a numeric account id, X will open the
   DM thread with the message already typed:
       x.com/messages/compose?recipient_id=<id>&text=<encoded>
   Without one there is no link that can prefill text, so we fall back to
   the profile and put the message on the clipboard instead.
========================================================================= */
function canPrefill(l){ return !!(l && l.xid); }

function dmURL(l, text){
  const app = db.settings.openInApp;
  if(canPrefill(l)){
    const q = "recipient_id=" + encodeURIComponent(l.xid) + "&text=" + encodeURIComponent(text||"");
    return app ? "twitter://messages/compose?" + q : "https://x.com/messages/compose?" + q;
  }
  if(!l.handle) return "https://x.com/messages";
  return app ? "twitter://user?screen_name=" + encodeURIComponent(l.handle)
             : "https://x.com/" + encodeURIComponent(l.handle);
}
function profileURL(l){
  return l.handle ? "https://x.com/" + encodeURIComponent(l.handle)
    : (l.xid ? "https://x.com/i/user/" + encodeURIComponent(l.xid) : "https://x.com");
}

/* Pull a handle and/or numeric id out of whatever the row happened to hold. */
function parseProfile(raw){
  const s = String(raw||"").trim();
  if(!s) return {handle:"", xid:""};
  let m = s.match(/(?:twitter|x)\.com\/i\/user\/(\d+)/i);
  if(m) return {handle:"", xid:m[1]};
  m = s.match(/(?:twitter|x)\.com\/(?:#!\/)?@?([A-Za-z0-9_]{1,15})(?:[/?#]|$)/i);
  if(m && !/^(i|home|messages|search|explore|intent|hashtag|share|compose)$/i.test(m[1])) return {handle:m[1], xid:""};
  if(/^\d{5,25}$/.test(s)) return {handle:"", xid:s};
  m = s.match(/^@?([A-Za-z0-9_]{1,15})$/);
  if(m) return {handle:m[1], xid:""};
  return {handle:"", xid:""};
}

/* ============================== message rendering ==============================
   {first} {name} {handle} {bio} {bioshort} {topic} {followers} {location}
   {me} {company} {pitch} {question} {greeting} {ask}
   Plus spintax: {saw|caught|came across} picks one at random, so no two
   DMs go out word-for-word identical.
============================================================================= */
const GREETINGS = ["really liked","just read","enjoyed","kept nodding through"];
const ASKS = ["Worth a quick look?","Open to me sending it over?","Want the short version?"];

function tokenValues(l){
  const s = db.settings;
  const bio = String(l.bio||"").replace(/\s+/g," ").trim();
  return {
    first: firstName(l.name) || l.handle || "there",
    name: l.name || l.handle || "there",
    handle: l.handle ? "@"+l.handle : "",
    bio: bio,
    bioshort: bio.length > 70 ? bio.slice(0,67).trim()+"…" : bio,
    topic: topicOf(l),
    followers: compact(l.followers),
    location: l.location || "",
    website: l.website || "",
    me: s.me || "",
    company: s.company || "",
    pitch: s.pitch || "",
    question: s.question || "",
    greeting: pick(GREETINGS),
    ask: pick(ASKS)
  };
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// A cheap stand-in for "what are they about" — first clause of the bio.
function topicOf(l){
  const bio = String(l.bio||"").replace(/\s+/g," ").trim();
  if(!bio) return "what you're building";
  const part = bio.split(/[|•·—–\-\/,.]/).map(s=>s.trim()).filter(s=>s.length>3)[0];
  return (part || bio).slice(0,48).replace(/[.\s]+$/,"") || "what you're building";
}

function spin(text){
  // Innermost-first so nested groups resolve correctly.
  let out = String(text||""), guard = 0;
  while(guard++ < 50){
    const next = out.replace(/\{([^{}]*\|[^{}]*)\}/g, (_, body) => pick(body.split("|")));
    if(next === out) break;
    out = next;
  }
  return out;
}
function renderMessage(tpl, l){
  const vals = tokenValues(l);
  let out = String(tpl||"");
  // Tokens first, so a token's own value can't be eaten by the spintax pass.
  out = out.replace(/\{([a-zA-Z_][a-zA-Z0-9_]*)\}/g, (m, k) => (k in vals) ? vals[k] : m);
  out = spin(out);
  // An empty token leaves a double space (or a stranded comma) behind.
  return out.replace(/[ \t]{2,}/g," ").replace(/\s+([,.!?])/g,"$1")
            .replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function tplById(id){ return db.templates.find(t => t.id === id) || db.templates[0] || null; }
function currentTpl(l){
  return tplById((l && l.tplId) || db.settings.tplId) || db.templates[0] || null;
}
function messageFor(l){
  if(l.draft) return l.draft;
  const t = currentTpl(l);
  return t ? renderMessage(t.body, l) : "";
}

/* ============================== CSV ==============================
   RFC4180-ish: quoted fields, escaped quotes, embedded newlines, and a
   sniffed delimiter so tab- and semicolon-separated exports work too.
================================================================== */
function sniffDelim(text){
  const line = text.split(/\r?\n/).find(l => l.trim()) || "";
  const counts = [[",",0],[";",0],["\t",0],["|",0]];
  let q = false;
  for(const ch of line){
    if(ch === '"') q = !q;
    if(q) continue;
    const hit = counts.find(c => c[0] === ch);
    if(hit) hit[1]++;
  }
  counts.sort((a,b) => b[1]-a[1]);
  return counts[0][1] ? counts[0][0] : ",";
}
function parseCSV(text, delim){
  text = String(text||"").replace(/^﻿/,"");
  const d = delim || sniffDelim(text);
  const rows = []; let row = []; let cell = ""; let q = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(q){
      if(c === '"'){
        if(text[i+1] === '"'){ cell += '"'; i++; }
        else q = false;
      } else cell += c;
      continue;
    }
    if(c === '"'){ q = true; continue; }
    if(c === d){ row.push(cell); cell = ""; continue; }
    if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; continue; }
    if(c === "\r"){ continue; }
    cell += c;
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}

const FIELDS = [
  {k:"",          label:"— skip —"},
  {k:"handle",    label:"Handle / username"},
  {k:"xid",       label:"Numeric user ID"},
  {k:"profile",   label:"Profile URL"},
  {k:"name",      label:"Display name"},
  {k:"bio",       label:"Bio"},
  {k:"followers", label:"Followers"},
  {k:"following", label:"Following"},
  {k:"tweets",    label:"Tweet count"},
  {k:"location",  label:"Location"},
  {k:"website",   label:"Website"},
  {k:"avatar",    label:"Avatar image URL"},
  {k:"verified",  label:"Verified"},
  {k:"tags",      label:"Tags"},
  {k:"note",      label:"Note"}
];
// Header guesses, longest/most specific first — order matters.
const GUESS = [
  [/^(rest_?id|user_?id|id_?str|twitter_?id|account_?id|author_?id)$/i, "xid"],
  [/^id$/i, "xid"],
  [/(screen_?name|user_?name|username|handle|nickname)/i, "handle"],
  [/(profile_?url|profile_?link|twitter_?url|user_?url|^url$|^link$|permalink)/i, "profile"],
  [/(profile_?image|avatar|image_?url|photo|picture|pfp)/i, "avatar"],
  [/(followers_?count|^followers$|follower_?count|fans)/i, "followers"],
  [/(following_?count|^following$|friends_?count)/i, "following"],
  [/(statuses_?count|tweets?_?count|posts?_?count)/i, "tweets"],
  [/(description|^bio$|about|headline|summary)/i, "bio"],
  [/(full_?name|display_?name|^name$|real_?name)/i, "name"],
  [/(location|city|country|region|place)/i, "location"],
  [/(website|expanded_?url|^site$|homepage|^link_?url$)/i, "website"],
  [/(verified|is_?blue|blue_?verified)/i, "verified"],
  [/(tags?|labels?|list|segment|category|niche)/i, "tags"],
  [/(notes?|comment|remark)/i, "note"]
];
function guessField(header, used){
  const h = String(header||"").trim();
  for(const [re, k] of GUESS){
    if(re.test(h) && !used.has(k)) return k;
  }
  return "";
}
function truthy(v){ return /^(1|true|yes|y|t)$/i.test(String(v||"").trim()); }
function toNum(v){
  const s = String(v==null?"":v).trim().replace(/,/g,"");
  const m = s.match(/^([\d.]+)\s*([KkMm])?$/);
  if(m){
    const n = parseFloat(m[1]);
    if(!isFinite(n)) return 0;
    if(/k/i.test(m[2]||"")) return Math.round(n*1e3);
    if(/m/i.test(m[2]||"")) return Math.round(n*1e6);
    return Math.round(n);
  }
  const n = parseInt(s.replace(/[^\d]/g,""),10);
  return isFinite(n) ? n : 0;
}

/* Turn mapped rows into leads, merging anything we already have. */
function buildLeads(rows, headerRow, map, listName){
  const out = [];
  const start = headerRow ? 1 : 0;
  for(let i=start;i<rows.length;i++){
    const r = rows[i];
    const rec = {};
    map.forEach((field, col) => {
      if(!field) return;
      const v = (r[col] == null ? "" : String(r[col])).trim();
      if(!v) return;
      rec[field] = rec[field] ? rec[field] : v;
    });
    let handle = "", xid = "";
    if(rec.profile){ const p = parseProfile(rec.profile); handle = p.handle; xid = p.xid; }
    if(rec.handle){ const p = parseProfile(rec.handle); handle = p.handle || handle; xid = xid || p.xid; }
    if(rec.xid && /^\d{5,25}$/.test(rec.xid.replace(/\D/g,""))) xid = rec.xid.replace(/\D/g,"");
    if(!handle && !xid) continue;
    out.push(mkLead({
      handle, xid,
      name: rec.name || "",
      bio: rec.bio || "",
      avatar: /^https?:\/\//i.test(rec.avatar||"") ? rec.avatar : "",
      website: rec.website || "",
      location: rec.location || "",
      followers: toNum(rec.followers),
      following: toNum(rec.following),
      tweets: toNum(rec.tweets),
      verified: truthy(rec.verified),
      tags: rec.tags ? String(rec.tags).split(/[,;|]/).map(s=>s.trim()).filter(Boolean) : [],
      note: rec.note || "",
      listName: listName || ""
    }));
  }
  return out;
}

/* Merge: same numeric id, or same handle (case-insensitive). New columns
   fill gaps on an existing lead but never clobber what you've typed. */
function mergeLeads(incoming){
  const byId = new Map(), byHandle = new Map();
  db.leads.forEach(l => {
    if(l.xid) byId.set(l.xid, l);
    if(l.handle) byHandle.set(l.handle.toLowerCase(), l);
  });
  let added = 0, updated = 0, dupes = 0;
  const seen = new Set();
  for(const n of incoming){
    const sig = n.xid ? "i:"+n.xid : "h:"+n.handle.toLowerCase();
    if(seen.has(sig)){ dupes++; continue; }
    seen.add(sig);
    const hit = (n.xid && byId.get(n.xid)) || (n.handle && byHandle.get(n.handle.toLowerCase()));
    if(hit){
      let changed = false;
      ["name","bio","avatar","website","location","note","listName"].forEach(k => {
        if(!hit[k] && n[k]){ hit[k] = n[k]; changed = true; }
      });
      ["followers","following","tweets"].forEach(k => {
        if(n[k] && n[k] !== hit[k]){ hit[k] = n[k]; changed = true; }
      });
      if(!hit.xid && n.xid){ hit.xid = n.xid; changed = true; }      // the upgrade that matters
      if(!hit.handle && n.handle){ hit.handle = n.handle; changed = true; }
      if(n.verified && !hit.verified){ hit.verified = true; changed = true; }
      n.tags.forEach(t => { if(!hit.tags.includes(t)){ hit.tags.push(t); changed = true; } });
      if(changed){ touch(hit); updated++; } else dupes++;
    } else {
      db.leads.push(n);
      if(n.xid) byId.set(n.xid, n);
      if(n.handle) byHandle.set(n.handle.toLowerCase(), n);
      added++;
    }
  }
  save();
  return {added, updated, dupes};
}

/* ============================== sending ============================== */
function allDms(){
  const out = [];
  db.leads.forEach(l => l.dms.forEach(d => out.push({lead:l, dm:d})));
  return out.sort((a,b) => b.dm.at - a.dm.at);
}
function dmsOn(day){ return allDms().filter(x => dayKey(x.dm.at) === day); }
function sentToday(){ return dmsOn(today()).length; }
function lastSentAt(){ const a = allDms(); return a.length ? a[0].dm.at : 0; }

function logSend(l, text, via){
  const dm = {id:uid(), at:Date.now(), text:String(text||""), tplId:(currentTpl(l)||{}).id || null, via:via||"link"};
  l.dms.push(dm);
  if(l.status === "queued") l.status = "sent";
  l.draft = "";
  touch(l); save();
  return dm;
}
function undoSend(l, dmId){
  const i = l.dms.findIndex(d => d.id === dmId);
  if(i < 0) return;
  l.dms.splice(i,1);
  if(!l.dms.length && l.status === "sent") l.status = "queued";
  touch(l); save();
}
function removeDm(leadId, dmId){
  const l = db.leads.find(x => x.id === leadId); if(!l) return null;
  const i = l.dms.findIndex(d => d.id === dmId); if(i < 0) return null;
  const [gone] = l.dms.splice(i,1);
  db.deletedDms.push(dmId);
  if(!l.dms.length && l.status === "sent") l.status = "queued";
  touch(l); save();
  return gone;
}

/* Fired from the click that also navigates to X, so the tab open stays
   inside the user gesture. */
function doSend(l, text){
  const dm = logSend(l, text, canPrefill(l) ? "prefill" : "manual");
  if(db.settings.autoCopy) copyText(text);
  const cap = +db.settings.dailyCap || 0;
  const n = sentToday();
  if(cap && n === cap) toast("That's " + n + " today — at your cap. Ease off.");
  else if(cap && n === Math.round(cap*0.8)) toast("Heads up: " + n + " of " + cap + " today.");
  else toast(canPrefill(l) ? "Logged — hit send in X" : "Message copied — paste it in X", () => {
    undoSend(l, dm.id); renderAll();
    if(focusOn) renderFocus();
  });
  return dm;
}

/* ============================== streaks & series ============================== */
function sendDays(){
  const set = new Set();
  db.leads.forEach(l => l.dms.forEach(d => set.add(dayKey(d.at))));
  return set;
}
function shiftDay(key, delta){
  const [y,m,d] = key.split("-").map(Number);
  const dt = new Date(y, m-1, d + delta);
  return dayKey(dt.getTime());
}
function streaks(){
  const days = sendDays();
  if(!days.size) return {current:0, longest:0, total:0};
  // A streak survives until a whole day passes with nothing sent, so
  // "today, nothing yet" still counts yesterday's chain.
  let cur = 0;
  let cursor = days.has(today()) ? today() : shiftDay(today(), -1);
  while(days.has(cursor)){ cur++; cursor = shiftDay(cursor, -1); }
  const sorted = Array.from(days).sort();
  let longest = 0, run = 0, prev = null;
  for(const d of sorted){
    run = (prev && shiftDay(prev,1) === d) ? run+1 : 1;
    if(run > longest) longest = run;
    prev = d;
  }
  return {current:cur, longest, total:days.size};
}
function series(days){
  const counts = new Map();
  db.leads.forEach(l => l.dms.forEach(d => {
    const k = dayKey(d.at);
    counts.set(k, (counts.get(k)||0)+1);
  }));
  const out = [];
  for(let i=days-1;i>=0;i--){
    const k = shiftDay(today(), -i);
    out.push({day:k, n:counts.get(k)||0});
  }
  return out;
}
function counts(){
  const c = {total:db.leads.length, dms:0};
  STATUS_ORDER.forEach(s => c[s] = 0);
  db.leads.forEach(l => { c[l.status]++; c.dms += l.dms.length; });
  c.contacted = db.leads.filter(l => l.dms.length).length;
  return c;
}

/* ============================== list ============================== */
const FOLLOWUP_DAYS = 3;
function daysSince(ts){ return ts ? (Date.now()-ts)/864e5 : 1e9; }
function lastDmAt(l){ return l.dms.length ? l.dms[l.dms.length-1].at : 0; }

const FILTERS = [
  {id:"queue",   label:"Queue",      fn:l => l.status === "queued"},
  {id:"ready",   label:"One-tap",    fn:l => l.status === "queued" && canPrefill(l)},
  {id:"noid",    label:"Needs ID",   fn:l => !canPrefill(l)},
  {id:"sent",    label:"Sent",       fn:l => l.status === "sent"},
  {id:"followup",label:"Follow up",  fn:l => l.status === "sent" && daysSince(lastDmAt(l)) >= FOLLOWUP_DAYS},
  {id:"replied", label:"Replied",    fn:l => l.status === "replied"},
  {id:"booked",  label:"Booked",     fn:l => l.status === "booked"},
  {id:"all",     label:"All",        fn:() => true}
];
let state = {
  filter:"queue", q:"", leadId:null, tab:"msg",
  selecting:false, sel:new Set(),
  focusIds:[], focusAt:0
};

function visible(){
  const f = FILTERS.find(x => x.id === state.filter) || FILTERS[0];
  const q = state.q.trim().toLowerCase();
  let out = db.leads.filter(f.fn);
  if(q){
    out = out.filter(l =>
      (l.name||"").toLowerCase().includes(q) ||
      (l.handle||"").toLowerCase().includes(q) ||
      (l.bio||"").toLowerCase().includes(q) ||
      (l.location||"").toLowerCase().includes(q) ||
      (l.listName||"").toLowerCase().includes(q) ||
      l.tags.some(t => t.toLowerCase().includes(q))
    );
  }
  // Untouched and one-tap-ready first; that is the order you want to work.
  return out.sort((a,b) => {
    const ad = a.dms.length ? 1 : 0, bd = b.dms.length ? 1 : 0;
    if(ad !== bd) return ad - bd;
    if(!ad){
      const ar = canPrefill(a) ? 0 : 1, br = canPrefill(b) ? 0 : 1;
      if(ar !== br) return ar - br;
      return (b.followers||0) - (a.followers||0);
    }
    return (b.dms[b.dms.length-1].at) - (a.dms[a.dms.length-1].at);
  });
}

function renderFilters(){
  const wrap = $("#filters");
  wrap.innerHTML = FILTERS.map(f => {
    const n = db.leads.filter(f.fn).length;
    return `<button class="chip" data-f="${f.id}" aria-pressed="${state.filter===f.id}">${esc(f.label)}<span class="n">${n}</span></button>`;
  }).join("");
}

function leadHTML(l){
  const st = STATUS[l.status] || STATUS.queued;
  const msg = messageFor(l);
  const href = dmURL(l, msg);
  const ready = canPrefill(l);
  const last = l.dms.length ? l.dms[l.dms.length-1] : null;
  const bits = [];

  else if(l.location) bits.push(`<span class="last">${esc(l.location)}</span>`);
  if(last) bits.push(`<span class="last">${esc(when(last.at))}</span>`);
  if(l.dms.length > 1) bits.push(`<span class="last">${l.dms.length} DMs</span>`);
  return `<article class="lead ${state.sel.has(l.id)?"sel":""}" data-id="${l.id}" style="--st:${st.color}">
    ${state.selecting ? `<label class="pick"><input type="checkbox" data-pick="${l.id}" ${state.sel.has(l.id)?"checked":""} aria-label="Select ${esc(l.handle)}" /></label>` : ""}
    <button class="leadbody" data-open="${l.id}">
      ${avatarHTML(l)}
      <span class="who">
        <span class="lname">${esc(l.name || l.handle || "Unknown")}${l.verified?'<span class="vf">✓</span>':""}</span>
        <span class="lhandle">@${esc(l.handle || "—")}</span>
        ${l.bio ? `<span class="lbio">${esc(l.bio)}</span>` : ""}
        <span class="lsub">
          <span class="tag" style="--st:${st.color}"><span class="dot"></span>${esc(st.label)}</span>
          ${bits.join('<span class="sep">·</span>')}
        </span>
      </span>
    </button>
    <a class="dmbtn ${ready?"":"manual"}" href="${esc(href)}" target="_blank" rel="noopener"
       data-send="${l.id}" aria-label="DM ${esc(l.handle)}">
      <span class="circle"><svg viewBox="0 0 24 24"><path d="M21.4 2.6a1 1 0 0 0-1.1-.2l-18 8a1 1 0 0 0 .1 1.9l7.3 2.1 2.1 7.3a1 1 0 0 0 1.9.1l8-18a1 1 0 0 0-.3-1.2z"/></svg></span>
      ${ready ? "" : '<span class="cap">copy</span>'}
    </a>
  </article>`;
}

function renderList(){
  const rows = visible();
  const el = $("#list");
  if(!rows.length){
    el.innerHTML = db.leads.length
      ? `<div class="empty"><h2>Nothing here</h2><p>No leads match this filter. Try <b>All</b>, or clear the search.</p></div>`
      : `<div class="empty"><h2>An empty sheet</h2>
         <p>Import a CSV of X profiles, or paste a column of profile links. Rows with a numeric user ID get a one-tap DM with your message already typed.</p>
         <button class="btn primary" id="emptyImport" style="flex:none;padding:12px 22px">Import a list</button>
         ${db.settings.me ? "" : `<div style="margin-top:14px"><button class="re" data-opensettings style="color:var(--send);font-size:13.5px">First, set your name and pitch</button></div>`}</div>`;

function renderStats(){
  const c = counts();

  const n = sentToday();
  const goal = +db.settings.dailyGoal || 0;
  $("#sToday").textContent = goal ? n + "/" + goal : String(n);

// Tokens that come from Settings rather than the lead — blank ones are the
// difference between a real message and "Quick context: I'm  and I".
const SELF_TOKENS = {me:"your name", company:"your company", pitch:"your one-line pitch", question:"your go-to question"};
function setupWarnHTML(l){
  const body = (currentTpl(l)||{}).body || "";
  const missing = Object.keys(SELF_TOKENS).filter(k => body.includes("{"+k+"}") && !String(db.settings[k]||"").trim());
  if(!missing.length) return "";
  return `<div class="idwarn"><b>Fill in your details.</b> This template wants ${
    missing.map(k => "<b>"+SELF_TOKENS[k]+"</b>").join(", ")
  } — blank for now, so the message reads oddly. <button class="re" data-opensettings style="color:var(--warn);font-weight:660">Open settings</button></div>`;
}
function idWarnHTML(){
  return `<div class="idwarn"><b>No numeric ID for this account.</b> X can't prefill a DM from a handle alone,

    Add the ID under <b>Info</b> to make it one-tap.</div>`;

let focusOn = false, paceT = null;

function startFocus(){
  const q = visible().filter(l => !DONE.includes(l.status));
  if(!q.length){ toast("Nothing queued in this filter"); return; }
  state.focusIds = q.map(l => l.id);

function closeFocus(){

  setTimeout(() => { if(!focusOn) el.hidden = true; }, 280);

}
function focusLead(){
  const id = state.focusIds[state.focusAt];

function renderFocus(){
  const l = focusLead();
  if(!l){
    const done = state.focusIds.length;
    $(".fwrap").innerHTML = `<div class="empty" style="padding:64px 24px">
      <h2>Queue cleared</h2><p>${done} ${plural(done,"lead")} worked through. ${sentToday()} DMs sent today.</p></div>`;
    $(".ffoot").innerHTML = `<button class="btn primary" id="fDone">Done</button>`;
    $("#fDone").addEventListener("click", closeFocus);
    $("#fCount").textContent = done + " / " + done;
    $("#fSub").textContent = "complete";
    $("#fRail").style.width = "100%";
    $("#fPace").textContent = "";
    return;
  }
  $("#fCount").textContent = (state.focusAt+1) + " / " + state.focusIds.length;

  $("#fSub").textContent = goal ? sentToday() + " of " + goal + " today" : sentToday() + " sent today";
  $("#fRail").style.width = Math.round(state.focusAt / state.focusIds.length * 100) + "%";

  paintAvatar($("#fAv"), l);
  $("#fName").innerHTML = esc(l.name || l.handle || "Unknown") + (l.verified?'<span class="vf">✓</span>':"");
  const h = $("#fHandle");

  h.href = profileURL(l);
  const nums = [];
  if(l.followers) nums.push(`<span><b>${compact(l.followers)}</b> followers</span>`);
  if(l.following) nums.push(`<span><b>${compact(l.following)}</b> following</span>`);
  if(l.location) nums.push(`<span>${esc(l.location)}</span>`);
  $("#fNums").innerHTML = nums.join("");

  $("#fWarn").innerHTML = setupWarnHTML(l) + (canPrefill(l) ? "" : idWarnHTML());

  fillTplSelect($("#fTpl"), l);
  $("#fMsg").value = messageFor(l);
  autoGrow($("#fMsg"));
  updateCount($("#fCt"), $("#fMsg").value);
  syncFocusLink();
  paceTick();

function syncFocusLink(){
  const l = focusLead(); if(!l) return;
  $("#fSend").href = dmURL(l, $("#fMsg").value);
  $("#fSendLabel").textContent = canPrefill(l) ? "Open DM" : "Copy & open";
}
function paceTick(){
  clearInterval(paceT);
  const el = $("#fPace");
  const cap = +db.settings.dailyCap || 0;
  const pace = +db.settings.paceSeconds || 0;
  const render = () => {
    const n = sentToday();
    if(cap && n >= cap){ el.textContent = "Daily cap reached — " + n + " sent"; el.className = "pace warn"; return; }
    const since = lastSentAt() ? Math.floor((Date.now()-lastSentAt())/1000) : 1e9;
    if(pace && since < pace){
      el.textContent = "Slow down — " + (pace-since) + "s";
      el.className = "pace warn";
    } else if(cap && n >= cap*0.8){
      el.textContent = n + " of " + cap + " today";
      el.className = "pace warn";
    } else {
      el.textContent = "";
      el.className = "pace";
    }
  };
  render();
  if(pace) paceT = setInterval(render, 1000);
}
function advance(){
  state.focusAt++;
  renderFocus();
  $(".fwrap").scrollTop = 0;
}

let imp = {rows:[], header:true, map:[], name:""};

function openImport(){
  imp = {rows:[], header:true, map:[], name:""};
  modal("Import profiles", `
    <p class="help">Drop a CSV from any X scraper. Bring the numeric user ID column
      (<code>id</code>, <code>rest_id</code>, <code>user_id</code>) if you have it — that's what lets X open
      the DM with your message already typed.</p>
    <div class="drop" id="drop">
      <b>Drop a CSV here</b>
      or <button id="pickFile" style="color:var(--send);text-decoration:underline;text-underline-offset:3px">choose a file</button>
    </div>
    <div class="section">Or paste</div>
    <textarea class="paste" id="pasteBox" placeholder="Paste CSV rows, or one profile link per line:&#10;https://x.com/naval&#10;https://x.com/patio11"></textarea>
  `, `<button class="btn" id="impCancel">Cancel</button><button class="btn primary" id="impNext">Continue</button>`);

  const drop = $("#drop");
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) readFile(f);
  });
  $("#pickFile").addEventListener("click", () => $("#filePick").click());
  $("#impCancel").addEventListener("click", closeSheet);
  $("#impNext").addEventListener("click", () => {

  });
}
$("#filePick").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if(f) readFile(f);
  e.target.value = "";
});
function readFile(f){
  const r = new FileReader();
  r.onload = () => ingest(String(r.result||""), f.name.replace(/\.[^.]+$/,""));
  r.onerror = () => toast("Couldn't read that file");
  r.readAsText(f);
}

function ingest(text, name){
  // A bare column of links or handles has no header row to map.
  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const bare = lines.length && lines.every(l => {
    if(/[,;\t]/.test(l)) return false;
    const p = parseProfile(l);
    return !!(p.handle || p.xid);
  });
  if(bare){
    const leads = lines.map(l => {
      const p = parseProfile(l);
      return mkLead({handle:p.handle, xid:p.xid, listName:name||""});
    });
    finishImport(leads, name);
    return;
  }
  const rows = parseCSV(text);
  if(!rows.length){ toast("No rows found"); return; }
  imp.rows = rows;
  imp.name = name || "";
  imp.header = looksLikeHeader(rows[0]);
  const used = new Set();
  imp.map = rows[0].map(h => {
    const g = imp.header ? guessField(h, used) : "";
    if(g) used.add(g);
    return g;
  });
  if(!imp.header && rows[0].length === 1) imp.map = ["profile"];
  renderMapStep();
}
function looksLikeHeader(row){
  const joined = row.join(" ").toLowerCase();
  if(/(name|user|screen|follow|bio|descri|url|id|location)/.test(joined)) return true;
  // A row of pure numbers or links is data, not headings.
  return !row.every(c => /^\s*(\d+|https?:\/\/)/.test(c));
}

function renderMapStep(){
  const rows = imp.rows;
  const head = rows[0];
  const sample = rows[imp.header ? 1 : 0] || [];
  const opts = f => FIELDS.map(x => `<option value="${x.k}" ${x.k===f?"selected":""}>${esc(x.label)}</option>`).join("");
  const mapHTML = head.map((h,i) => `
    <div class="maprow">
      <div class="src">${esc(imp.header ? (h||"(blank)") : "Column "+(i+1))}<i>${esc(String(sample[i]||"").slice(0,44))}</i></div>
      <select data-col="${i}">${opts(imp.map[i])}</select>
    </div>`).join("");

  modal("Match the columns", `
    <label class="row" style="margin-bottom:12px">
      <input type="checkbox" id="hasHeader" ${imp.header?"checked":""} />
      <span class="nm"><b>First row is headings</b><span>${esc(head.slice(0,4).join(" · ").slice(0,60))}</span></span>
    </label>
    <div class="f" style="margin-bottom:12px">
      <label for="impList">List name</label>
      <input id="impList" type="text" value="${esc(imp.name)}" placeholder="e.g. SaaS founders — Aug" />
      <div class="hint">Tags every row so you can filter and compare lists later.</div>
    </div>
    <div class="section">Columns</div>
    <div id="mapWrap">${mapHTML}</div>
    <div class="preview" id="impPreview"></div>
  `, `<button class="btn" id="impBack">Back</button><button class="btn primary" id="impGo">Import</button>`);

  $("#hasHeader").addEventListener("change", e => {
    imp.header = e.target.checked;
    const used = new Set();
    imp.map = imp.rows[0].map(h => { const g = imp.header ? guessField(h, used) : ""; if(g) used.add(g); return g; });
    renderMapStep();
  });
  $("#mapWrap").addEventListener("change", e => {
    const s = e.target.closest("[data-col]"); if(!s) return;
    imp.map[+s.getAttribute("data-col")] = s.value;
    updatePreview();
  });
  $("#impBack").addEventListener("click", openImport);
  $("#impGo").addEventListener("click", () => {
    const list = $("#impList").value.trim();
    const leads = buildLeads(imp.rows, imp.header, imp.map, list);
    if(!leads.length){ toast("No handles or IDs found in those columns"); return; }
    finishImport(leads, list);
  });
  updatePreview();
}
function updatePreview(){
  const leads = buildLeads(imp.rows, imp.header, imp.map, "");
  const withId = leads.filter(canPrefill).length;
  const el = $("#impPreview");
  if(!el) return;
  el.innerHTML = !leads.length
    ? `<span style="color:var(--warn)">No usable rows yet — map a column to <b>Handle</b>, <b>Profile URL</b> or <b>Numeric user ID</b>.</span>`
    : `<b>${leads.length}</b> ${plural(leads.length,"profile")} · <b>${withId}</b> one-tap ready${withId < leads.length ? ` · <b>${leads.length-withId}</b> copy-and-paste` : ""}`;
}
function finishImport(leads, name){
  const r = mergeLeads(leads);
  closeSheet();
  state.filter = "queue";
  renderAll();
  const bits = [];
  if(r.added) bits.push(r.added + " added");
  if(r.updated) bits.push(r.updated + " updated");
  if(r.dupes) bits.push(r.dupes + " already there");
  toast(bits.join(" · ") || "Nothing new");
}
$("#btnImport").addEventListener("click", openImport);

/* ============================== templates ============================== */
const TOKENS = ["{first}","{name}","{handle}","{bio}","{bioshort}","{topic}","{followers}","{location}","{me}","{company}","{pitch}","{question}"];

function openTemplates(){
  const rows = db.templates.map(t => {
    const uses = allDms().filter(x => x.dm.tplId === t.id);
    const replies = uses.filter(x => ["replied","booked"].includes(x.lead.status)).length;
    const rate = uses.length ? Math.round(replies/uses.length*100) + "% reply" : "unused";
    return `<div class="row ${t.id===db.settings.tplId?"on":""}">
      <div class="nm"><b>${esc(t.name)}</b><span>${uses.length} sent · ${rate}</span></div>
      ${t.id===db.settings.tplId
        ? `<span class="mini" style="color:var(--send);border-color:var(--send)">Default</span>`
        : `<button class="mini" data-use="${t.id}">Make default</button>`}
      <button class="mini" data-edit="${t.id}">Edit</button>
      <button class="mini danger" data-del="${t.id}">×</button>
    </div>`;
  }).join("");
  modal("Message templates", `
    <p class="help">Curly tokens fill from each lead: ${TOKENS.slice(0,6).map(t=>`<code>${t}</code>`).join(" ")} and more.
      Braces with pipes rotate at random — <code>{Hey|Hi|Yo}</code> — so no two DMs go out identical.</p>
    <div class="rows">${rows}</div>
  `, `<button class="btn" id="tplClose">Close</button><button class="btn primary" id="tplNew">New template</button>`);
  $("#tplClose").addEventListener("click", closeSheet);
  $("#tplNew").addEventListener("click", () => editTemplate(null));
  $("#mBody").querySelector(".rows").addEventListener("click", e => {
    const use = e.target.closest("[data-use]");
    if(use){ db.settings.tplId = use.getAttribute("data-use"); save(); openTemplates(); renderList(); toast("Default template set"); return; }
    const ed = e.target.closest("[data-edit]");
    if(ed){ editTemplate(ed.getAttribute("data-edit")); return; }
    const del = e.target.closest("[data-del]");
    if(del){
      if(db.templates.length < 2){ toast("Keep at least one"); return; }
      const id = del.getAttribute("data-del");
      db.templates = db.templates.filter(t => t.id !== id);
      if(db.settings.tplId === id) db.settings.tplId = db.templates[0].id;
      save(); openTemplates(); renderList();
    }
  });
}
function editTemplate(id){
  const t = db.templates.find(x => x.id === id) || {id:null, name:"", body:DEFAULT_TPL};
  modal(id ? "Edit template" : "New template", `
    <div class="f" style="margin-bottom:12px"><label for="tName">Name</label>
      <input id="tName" type="text" value="${esc(t.name)}" placeholder="e.g. Warm intro" /></div>
    <div class="f"><label for="tBody">Message</label>
      <textarea id="tBody" style="min-height:220px;font-size:15px;line-height:1.55">${esc(t.body)}</textarea></div>
    <div class="tokens">${TOKENS.map(k => `<button data-tok="${esc(k)}">${esc(k)}</button>`).join("")}</div>
    <div class="section">Preview</div>
    <div class="row" style="display:block"><div id="tPrev" style="white-space:pre-wrap;font-size:14px;line-height:1.55"></div></div>
  `, `<button class="btn" id="tCancel">Back</button><button class="btn primary" id="tSave">Save</button>`);

  const sample = db.leads[0] || mkLead({handle:"naval", name:"Naval Ravikant", bio:"Angel investor. Building things.", followers:2400000});
  const prev = () => { $("#tPrev").textContent = renderMessage($("#tBody").value, sample); };
  prev();
  $("#tBody").addEventListener("input", prev);
  $("#mBody").querySelector(".tokens").addEventListener("click", e => {
    const b = e.target.closest("[data-tok]"); if(!b) return;
    const ta = $("#tBody"), tok = b.getAttribute("data-tok");
    const s = ta.selectionStart, en = ta.selectionEnd;
    ta.value = ta.value.slice(0,s) + tok + ta.value.slice(en);
    ta.focus(); ta.setSelectionRange(s+tok.length, s+tok.length);
    prev();
  });
  $("#tCancel").addEventListener("click", openTemplates);
  $("#tSave").addEventListener("click", () => {
    const name = $("#tName").value.trim() || "Untitled";
    const body = $("#tBody").value;
    if(!body.trim()){ toast("Write something first"); return; }
    if(id){
      const hit = db.templates.find(x => x.id === id);
      hit.name = name; hit.body = body; hit.updated = Date.now();
    } else {
      const n = {id:uid(), name, body, updated:Date.now()};
      db.templates.push(n);
      if(!db.settings.tplId) db.settings.tplId = n.id;
    }
    save(); openTemplates(); renderList();
  });
}
$("#btnTpl").addEventListener("click", openTemplates);

/* ============================== the numbers ============================== */
function openStats(){
  const st = streaks();
  const c = counts();
  const n = sentToday();
  const goal = +db.settings.dailyGoal || 0;
  const s30 = series(30);
  const best = s30.slice().sort((a,b) => b.n-a.n)[0] || {n:0};
  const allTime = c.dms;
  const last7 = series(7).reduce((a,b) => a+b.n, 0);

  const R = 33, C = 2*Math.PI*R;
  const pct = goal ? Math.min(1, n/goal) : 0;
  const ringHTML = goal ? `
    <div class="ring ${n>=goal?"done":""}">
      <svg viewBox="0 0 76 76"><circle class="trk" cx="38" cy="38" r="${R}"></circle>
        ${pct > 0 ? `<circle class="val" cx="38" cy="38" r="${R}" stroke-dasharray="${(C*pct).toFixed(1)} ${C.toFixed(1)}"></circle>` : ""}</svg>
      <div class="txt">
        <b>${n} of ${goal} today</b>
        <p>${n>=goal ? "Goal hit. Streak is safe." : (goal-n) + " more to keep the streak alive."}</p>
      </div>
    </div>` : "";

  const max = Math.max(1, ...s30.map(d => d.n));
  const bars = s30.map((d,i) => `<div class="bar ${d.n?"":"zero"} ${d.day===today()?"today":""}"
      style="height:${d.n ? Math.max(3, Math.round(d.n/max*100)) : 2}%" data-i="${i}" title="${d.day}: ${d.n}"></div>`).join("");

  // 18 weeks of squares, Monday-first columns.
  const heatDays = 126;
  const cells = [];
  const startPad = (new Date(shiftDay(today(), -(heatDays-1)) + "T00:00:00").getDay() + 6) % 7;
  for(let i=0;i<startPad;i++) cells.push(`<i class="out"></i>`);
  series(heatDays).forEach(d => {
    const lv = d.n === 0 ? 0 : d.n < 3 ? 1 : d.n < 8 ? 2 : d.n < 16 ? 3 : 4;
    cells.push(`<i data-l="${lv}" title="${d.day}: ${d.n} sent"></i>`);
  });

  const fun = [
    ["Imported", c.total, "var(--slate)"],
    ["DM'd", c.contacted, "var(--send)"],
    ["Replied", c.replied + c.booked, "var(--good)"],
    ["Booked", c.booked, "var(--violet)"]
  ];
  const fmax = Math.max(1, c.total);
  const funHTML = fun.map(([lb,v,col]) => `
    <div class="fun"><span class="lb">${lb}</span>
      <span class="track"><i style="--fc:${col};width:${Math.round(v/fmax*100)}%"></i></span>
      <span class="vv"><b>${v}</b> ${c.total?Math.round(v/c.total*100):0}%</span></div>`).join("");

  modal("Your numbers", `
    ${ringHTML}
    <div class="heroes">
      <div class="hero"><b style="color:var(--warn)">${st.current}</b><span>Day streak</span><i>Best: ${st.longest} ${plural(st.longest,"day")}</i></div>
      <div class="hero"><b>${last7}</b><span>Last 7 days</span><i>${(last7/7).toFixed(1)}/day</i></div>
      <div class="hero"><b>${allTime}</b><span>DMs all time</span><i>${st.total} active ${plural(st.total,"day")}</i></div>
      <div class="hero"><b>${best.n}</b><span>Best day</span><i>${best.n ? esc(fmtDay(best.day)) : "—"}</i></div>
    </div>

    <div class="section">Last 30 days</div>
    <div class="chartwrap">
      <div class="chart" id="chart">
        <div class="gridline" style="bottom:100%"><span>${max}</span></div>
        ${max >= 2 ? `<div class="gridline" style="bottom:50%"><span>${Math.round(max/2)}</span></div>` : ""}
        ${bars}
        <div class="tip" id="tip"></div>
      </div>
      <div class="xlab"><span>${esc(fmtDay(s30[0].day))}</span><span>today</span></div>
    </div>

    <div class="section">Don't break the chain</div>
    <div class="heat">${cells.join("")}</div>
    <div class="legend">less <i style="background:var(--sunk)"></i><i data-l="1" style="background:color-mix(in srgb,var(--send) 28%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--send) 55%,var(--sunk))"></i><i style="background:color-mix(in srgb,var(--send) 78%,var(--sunk))"></i><i style="background:var(--send)"></i> more</div>

    <div class="section">Where the list stands</div>
    <div class="funnel">${funHTML}</div>
  `, `<button class="btn primary" id="stClose">Close</button>`);

  $("#stClose").addEventListener("click", closeSheet);
  const chart = $("#chart"), tip = $("#tip");
  chart.addEventListener("pointermove", e => {
    const b = e.target.closest(".bar");
    if(!b){ tip.classList.remove("on"); return; }
    const d = s30[+b.getAttribute("data-i")];
    tip.innerHTML = `<b>${d.n}</b> on ${esc(fmtDay(d.day))}`;
    const r = chart.getBoundingClientRect(), br = b.getBoundingClientRect();
    tip.style.left = (br.left - r.left + br.width/2) + "px";
    tip.style.bottom = (r.bottom - br.top + 6) + "px";
    tip.classList.add("on");
  });
  chart.addEventListener("pointerleave", () => tip.classList.remove("on"));
}
$("#btnStats").addEventListener("click", openStats);
$("#tToday").addEventListener("click", openStats);
$("#tStreak").addEventListener("click", openStats);
$("#tRep").addEventListener("click", () => { state.filter = "replied"; renderFilters(); renderList(); });

      <div class="f"><label for="seQ">Go-to question</label><input id="seQ" data-s="question" type="text" value="${esc(s.question)}" />

        <span class="nm"><b>Copy on send</b><span>Message goes to the clipboard too, as a safety net</span></span></label>
      <label class="row"><input type="checkbox" data-s="openInApp" ${s.openInApp?"checked":""} />
        <span class="nm"><b>Open in the X app</b><span>Uses twitter:// links. Only if the app is installed</span></span></label>
    </div>

    <div class="section">Look</div>
    <div class="f"><label for="seTheme">Theme</label>
      <select id="seTheme" data-s="theme">
        <option value="auto" ${s.theme==="auto"?"selected":""}>Match device</option>
        <option value="light" ${s.theme==="light"?"selected":""}>Light</option>
        <option value="dark" ${s.theme==="dark"?"selected":""}>Dark</option>
      </select></div>

    <div class="section">Data</div>
    <div class="rows">
      <div class="row"><div class="nm"><b>Backup</b><span>${db.leads.length} leads, ${counts().dms} DMs logged</span></div>

  $("#seClose").addEventListener("click", closeSheet);

      save();
      if(k === "theme") applyTheme();
      renderStats(); renderList();

  $("#seBackup").addEventListener("click", downloadBackup);

$("#btnSettings").addEventListener("click", openSettings);
document.addEventListener("click", e => {
  if(!e.target.closest("[data-opensettings]")) return;
  if(focusOn) closeFocus();
  closeSheet();
  setTimeout(openSettings, 300);
});

function download(name, text, mime){
  const blob = new Blob([text], {type:mime || "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadBackup(){
  download("dmaura-backup-" + today() + ".json", JSON.stringify(db, null, 2), "application/json");
  toast("Backup downloaded");
}
function restoreBackup(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(String(r.result||""));
        if(!d || !Array.isArray(d.leads)) throw new Error("not a DM Aura backup");
        db = Object.assign(blank(), d);
        db.leads = db.leads.map(mkLead);
        save(); closeSheet(); renderAll();
        toast("Restored " + db.leads.length + " leads");
      }catch(e){ toast("That file isn't a DM Aura backup"); }
    };
    r.readAsText(f);
  });
  inp.click();
}

const CSV_COLS = ["handle","xid","name","bio","followers","following","location","website","status","tags","listName","dms","lastSentAt","note"];
function csvCell(v){
  const s = String(v==null?"":v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
$("#btnExport").addEventListener("click", () => {
  const rows = visible();
  if(!rows.length){ toast("Nothing to export"); return; }
  const lines = [CSV_COLS.join(",")];
  rows.forEach(l => {
    const last = l.dms.length ? new Date(l.dms[l.dms.length-1].at).toISOString() : "";
    lines.push([l.handle, l.xid, l.name, l.bio, l.followers, l.following, l.location, l.website,
      l.status, l.tags.join("|"), l.listName, l.dms.length, last, l.note].map(csvCell).join(","));
  });
  download("dmaura-" + state.filter + "-" + today() + ".csv", lines.join("\n"), "text/csv;charset=utf-8");
  toast(rows.length + " rows exported");
});

/* ============================== boot ============================== */
function applyTheme(){
  const t = db.settings.theme || "auto";
  if(t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

db = load();
if(!db.settings.tplId && db.templates.length) db.settings.tplId = db.templates[0].id;
save();                       // so the store exists from the first visit on
applyTheme();
renderAll();
$("#booting").hidden = true;

// A day can roll over while the tab sits open; refresh the counters on return.
document.addEventListener("visibilitychange", () => { if(!document.hidden) renderStats(); });

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

})();
