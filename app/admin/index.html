<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DM Aura — Trial Activation</title>
<link rel="icon" id="favicon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;560;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F7F3EB; --ink:#14171F; --muted:#6B6F7A; --line:#E4DFD3;
    --cobalt:#2C4CDB; --green:#1F9D6C; --red:#D64545; --card:#FFFFFF;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --sans: "Instrument Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);padding:24px 16px 60px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:22px;font-weight:700;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
  .sub b{color:var(--ink)}
  .accountbar{display:none;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;margin-bottom:20px;font-size:13px}
  .accountbar .who{color:var(--muted)}
  .accountbar .who b{color:var(--ink);font-weight:600}
  .accountbar button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:12.5px;font-family:var(--sans);cursor:pointer}
  .accountbar button:hover{border-color:var(--muted)}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:120px}
  .stat .n{font-family:var(--mono);font-size:22px;font-weight:600}
  .stat .l{font-size:12px;color:var(--muted);margin-top:2px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:none}
  .mono{font-family:var(--mono);font-size:12.5px}
  .dim{color:var(--muted)}
  .yes{color:var(--green);font-weight:600}
  .no{color:var(--muted)}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .badge.on{background:#E4F6ED;color:var(--green)}
  .badge.off{background:#F1EEE5;color:var(--muted)}
  .scroll{overflow-x:auto;border-radius:12px}
  .msg{padding:40px 0;text-align:center;color:var(--muted)}
  .err{background:#FCEBEA;border:1px solid #F2C6C2;color:var(--red);padding:12px 16px;border-radius:10px;font-size:13.5px;margin-bottom:16px}
  .loginform{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;max-width:340px}
  .loginform label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:14px}
  .loginform input{display:block;width:100%;margin-top:6px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--sans);background:var(--ground)}
  .loginform input:focus{outline:2px solid var(--cobalt);outline-offset:1px}
  .loginform button{width:100%;padding:10px;border:none;border-radius:8px;background:var(--cobalt);color:#fff;font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;margin-top:4px}
  .loginform button:hover{opacity:.92}
  .loginform button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <h1>Trial activation</h1>
  <p class="sub">Activated = imported a list and sent <b id="threshold">20</b> DMs within <b id="window">48</b> hours of signup.</p>

  <div id="accountBar" class="accountbar">
    <span class="who">Signed in as <b id="whoEmail"></b></span>
    <button id="signOutBtn" type="button">Sign out</button>
  </div>

  <div id="statsRow" class="stats"></div>
  <div id="content"><div class="msg">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// This page lives at .../app/admin/ (or .../app/admin/index.html). Some hosts
// don't redirect the slash-less URL to the directory one, which makes plain
// relative paths like "../config.js" resolve against the wrong folder. Strip
// the known "/admin" (or "/admin/", "/admin/index.html") suffix instead of
// relying on the browser to have a trailing slash to resolve against.
const APP_DIR = location.pathname.replace(/\/admin(\/(index\.html)?)?$/, "/");
document.getElementById("favicon").href = APP_DIR + "icon.svg";

function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(s);
  });
}

const ACTIVATION_DM_COUNT = 20;
const ACTIVATION_WINDOW_HOURS = 48;
document.getElementById("threshold").textContent = ACTIVATION_DM_COUNT;
document.getElementById("window").textContent = ACTIVATION_WINDOW_HOURS;

const content = document.getElementById("content");
const statsRow = document.getElementById("statsRow");
const accountBar = document.getElementById("accountBar");
let sb = null;

function fmtDate(iso){
  if(!iso) return '<span class="dim">—</span>';
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function checkOrDash(bool){
  return bool ? '<span class="yes">✓</span>' : '<span class="no">–</span>';
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderLoginForm(message){
  accountBar.style.display = "none";
  statsRow.innerHTML = "";
  content.innerHTML = `
    <form id="loginForm" class="loginform">
      ${message ? `<div class="err">${esc(message)}</div>` : ""}
      <label>Email<input type="email" id="loginEmail" required autocomplete="email"></label>
      <label>Password<input type="password" id="loginPassword" required autocomplete="current-password"></label>
      <button type="submit" id="loginSubmit">Sign in</button>
      <div id="loginErr" class="err" style="display:none;margin-top:14px"></div>
    </form>
  `;
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const submitBtn = document.getElementById("loginSubmit");
    const errBox = document.getElementById("loginErr");
    errBox.style.display = "none";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email, password });
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
    if(error){
      errBox.textContent = error.message;
      errBox.style.display = "block";
      return;
    }
    render();
  });
}

async function loadDashboard(){
  const { data, error } = await sb.rpc("admin_trial_activation");

  if(error){
    if(/not authorized/i.test(error.message)){
      renderLoginForm("That account isn't on the admin list — sign in with an admin email, or add this one to the allowlist in the SQL function.");
      return;
    }
    content.innerHTML = `<div class="err">Couldn't load activation data: ${esc(error.message)}<br><br>
      Most likely the <code>admin_trial_activation</code> SQL function hasn't been run yet in Supabase
      (SQL Editor → paste the block from the README's "Admin: trial activation dashboard" section → Run).</div>`;
    return;
  }
  if(!data || !data.length){
    content.innerHTML = '<div class="msg">No signed-up users yet.</div>';
    return;
  }

  const total = data.length;
  const activated = data.filter(r => r.activated).length;
  const imported = data.filter(r => r.first_import_at).length;
  statsRow.innerHTML = `
    <div class="stat"><div class="n">${total}</div><div class="l">Signed up</div></div>
    <div class="stat"><div class="n">${imported}</div><div class="l">Imported a list</div></div>
    <div class="stat"><div class="n">${activated}</div><div class="l">Activated</div></div>
    <div class="stat"><div class="n">${total ? Math.round(activated/total*100) : 0}%</div><div class="l">Activation rate</div></div>
  `;

  const rows = data.map(r => `
    <tr>
      <td>${esc(r.email)}</td>
      <td class="mono">${fmtDate(r.signed_up_at)}</td>
      <td class="mono">${fmtDate(r.last_login_at)}</td>
      <td>${checkOrDash(!!r.first_import_at)}</td>
      <td>${checkOrDash(!!r.first_dm_at)}</td>
      <td class="mono">${r.dm_count}</td>
      <td class="mono">${r.dms_in_48h}</td>
      <td><span class="badge ${r.activated ? "on" : "off"}">${r.activated ? "Activated" : "Not yet"}</span></td>
    </tr>
  `).join("");

  content.innerHTML = `
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Email</th><th>Signed up</th><th>Last login</th>
            <th>Imported</th><th>First DM</th><th>DMs (total)</th>
            <th>DMs in ${ACTIVATION_WINDOW_HOURS}h</th><th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function render(){
  const { data: { user } } = await sb.auth.getUser();
  if(!user){
    renderLoginForm();
    return;
  }
  document.getElementById("whoEmail").textContent = user.email;
  accountBar.style.display = "flex";
  content.innerHTML = '<div class="msg">Loading…</div>';
  await loadDashboard();
}

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  render();
});

async function init(){
  try{
    await loadScript(APP_DIR + "config.js");
  }catch(e){
    content.innerHTML = `<div class="err">Couldn't load <code>${esc(APP_DIR)}config.js</code>: ${esc(e.message)}</div>`;
    return;
  }
  const CFG = window.DMAURA_CONFIG || {};
  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY){
    content.innerHTML = '<div class="err">No Supabase project configured in <code>app/config.js</code> — this dashboard needs one (see README).</div>';
    return;
  }
  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  render();
}
init();
</script>
</body>
</html>
